// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.androidx_appcompat_version = '1.7.1'
    ext.androidx_constraintlayout_version = '2.2.1'
    ext.androidx_core_version = '1.17.0'
    ext.androidx_documentfile_version = '1.0.1'
    ext.androidx_emoji_version = '1.1.0'
    ext.androidx_exifinterface_version = '1.0.0'
    ext.androidx_testrunner_version = '1.7.0'
    ext.androidx_viewpager_version = '1.1.0'
    ext.autodispose_version = '1.4.1'
    ext.billing_version = '5.1.0'
    ext.conductor_version = '3.2.0'
    ext.coroutines_version = '1.10.2'
    ext.dagger_version = "2.16"
    ext.espresso_version = '3.1.0-alpha3'
    ext.exoplayer_version = "2.19.1"
    ext.glide_version = "4.16.0"
    ext.junit_version = '4.13.2'
    ext.kotlin_version = '2.2.0'
    ext.lifecycle_version = '2.2.0'
    ext.material_version = '1.13.0'
    ext.mockito_version = '5.20.0'
    ext.moshi_version = '1.15.2'
    ext.okhttp3_version = '4.10.0'
    ext.realm_version = '10.19.0'
    ext.realm_adapters_version = '3.1.0'
    ext.rxandroid_version = '2.0.1'
    ext.rxdogtag_version = '1.0.2'
    ext.rxbinding_version = '2.2.0'
    ext.rxjava_version = '2.2.21'
    ext.rxkotlin_version = '2.4.0'
    ext.rx_preferences_version = '2.0.1'
    ext.timber_version = '5.0.1'

    ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }

//        maven { url 'https://maven.google.com' }
//        jcenter()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "io.realm:realm-gradle-plugin:$realm_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }

        google()
//        jcenter()
        maven { url "https://jitpack.io" }
//        maven { url 'https://maven.google.com' }
        maven {
            name 'glide-snapshot'
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
//        mavenCentral()

    }
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') ||
                project.plugins.hasPlugin('com.android.library')) {

            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate {
        if (project.hasProperty('kapt')) {
            kapt {
                // we expect this closure to run over a org.jetbrains.kotlin.gradle.plugin.KaptExtension
                javacOptions {
                    option("-source", "8")
                    option("-target", "8")
                }
            }
        }
    }
}
