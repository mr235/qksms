// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.androidx_appcompat_version = '1.8.0'
    ext.androidx_constraintlayout_version = '2.2.2'
    ext.androidx_core_version = '1.19.0'
    ext.androidx_documentfile_version = '1.1.0'
    ext.androidx_emoji_version = '1.2.0'
    ext.androidx_exifinterface_version = '1.4.2'
    ext.androidx_testrunner_version = '1.7.0'
    ext.androidx_viewpager_version = '1.1.0'
    ext.autodispose_version = '1.4.1'
    ext.billing_version = '5.1.0'
    ext.conductor_version = '3.2.0'
    ext.coroutines_version = '1.10.2'
    ext.dagger_version = "2.60.1"
    ext.datashare_version = '1.3.0'
    ext.espresso_version = '3.7.0'
    ext.exoplayer_version = "2.19.1"
    ext.ez_vcard_version = '0.12.1'
    ext.firebase_crashlytics_version = '20.1.0'
    ext.glide_version = "5.0.9"
    ext.junit_version = '4.13.2'
    ext.kotlin_version = '2.3.21'
    ext.ksp_version = '2.3.11'
    ext.libphonenumber_version = '9.0.5'
    ext.lifecycle_version = '2.11.0'
    ext.material_version = '1.14.0'
    ext.mockito_version = '5.23.0'
    ext.moshi_version = '1.15.2'
    ext.okhttp_version = '5.5.0'
    ext.room_version = '2.8.4'
    ext.rxandroid_version = '2.1.1'
    ext.rxdogtag_version = '1.0.2'
    ext.rxbinding_version = '3.1.0'
    ext.rxjava_version = '2.2.21'
    ext.rxkotlin_version = '2.4.0'
    ext.rx_preferences_version = '2.0.1'
    ext.timber_version = '5.0.1'
    ext.pinyin4j_version = '2.5.1'

    ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

    // Android SDK levels & app version (shared across all modules)
    ext.compileSdkLevel = 37
    ext.minSdkLevel = 23
    ext.targetSdkLevel = 37
    ext.appVersionCode = 2220
    ext.appVersionName = '3.10.1'

    repositories {
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.0'
        classpath 'com.android.tools.build:gradle-kotlin:9.3.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"
    }
}

allprojects {
    repositories {
        maven {
            name 'glide-snapshot'
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') ||
                project.plugins.hasPlugin('com.android.library')) {

            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            kotlin {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate {
        if (project.hasProperty('kapt')) {
            kapt {
                // we expect this closure to run over a org.jetbrains.kotlin.gradle.plugin.KaptExtension
                javacOptions {
                    option("-source", "8")
                    option("-target", "8")
                }
            }
        }
    }
}
